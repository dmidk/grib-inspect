# https://pre-commit.com/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.0.1
    hooks:
      - id: trailing-whitespace
        exclude: requirements.txt
      - id: end-of-file-fixer
      - id: check-yaml
  # isort should run before black as black sometimes tweaks the isort output
  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
  # https://github.com/python/black#version-control-integration
  - repo: https://github.com/psf/black
    rev: 22.3.0
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        args:
          # black wraps at 88, not flake8's default 79 -- match black so the
          # two tools don't fight each other.
          - --max-line-length=88
          # E203 (whitespace before ':') conflicts with black's slice
          # formatting (e.g. `x[1 :2]` vs `x[1: 2]`); black is right, flake8's
          # PEP8 reading here is outdated. Recommended by black's own docs.
          - --extend-ignore=E203
          # E402 (module import not at top) fires on the tests/ self-checks'
          # `sys.path.insert(...)` before `from grib_inspect...`, which is
          # required so a test can import the package without installing it
          # first (see tests/test_compare.py, tests/test_db.py).
          - --per-file-ignores=tests/*.py:E402
